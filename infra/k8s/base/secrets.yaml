apiVersion: v1
kind: Secret
metadata:
  name: neofilm-secrets
  namespace: neofilm
type: Opaque
# TEMPLATE ONLY — do not commit real values here. Fill these in at deploy time
# via a sealed-secret / vault / `kubectl create secret`, never in git. Values are
# left empty on purpose so no secret-shaped literal (sk_… / whsec_… / a DB
# password) sits in the repository and trips secret scanners.
stringData:
  DATABASE_URL: ""
  REDIS_PASSWORD: ""
  JWT_SECRET: ""
  JWT_REFRESH_SECRET: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_BUCKET: "neofilm-prod"
  MQTT_USERNAME: ""
  MQTT_PASSWORD: ""
