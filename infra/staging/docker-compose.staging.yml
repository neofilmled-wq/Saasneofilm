# NeoFilm — STAGING, totalement isole de la prod. Fichier AUTONOME (toutes les
# valeurs staging sont ici, aucun .env a creer).
#
# Sur le NAS :
#   1. dossier dedie :            /volume2/docker/neofilm-staging/
#   2. y sauver ce fichier sous : docker-compose.yml
#   3. lancer :                   sudo docker compose -p neofilm-staging up -d
#
# Isolation vs prod (projet `neofilm`) :
#   - volumes /volume2/docker/neofilm-staging/...   (jamais ...neofilm/...)
#   - ports hote decales                             (aucune collision)
#   - images :staging                                (jamais :latest)
#   - secrets staging dedies                         (jamais les secrets prod)
#
# Acces : https://neofilmtestapi.alkaya.fr via le NPM *deja existant* de la prod
# (ne PAS relancer un 2e nginx-proxy-manager). Ajouter dans ce NPM un proxy host
# host=neofilmtestapi.alkaya.fr -> <IP du NAS>:3011 (l'API staging), + au besoin
# /coworking -> :3016 et /tv -> :3015.

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: neofilm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: NeoStaging2026!
    volumes:
      - /volume2/docker/neofilm-staging/postgres:/var/lib/postgresql/data
    ports:
      - '5443:5432' # prod = 5433

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass NeoStagingRedis2026! --stop-writes-on-bgsave-error no
    volumes:
      - /volume2/docker/neofilm-staging/redis:/data
    ports:
      - '6390:6379' # prod = 6379

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: NeoStagingMinio2026!
    volumes:
      - /volume2/docker/neofilm-staging/minio:/data
    ports:
      - '9010:9000' # prod = 9000
      - '9011:9001' # prod = 9001

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin NeoStagingMinio2026!;
      mc mb --ignore-existing local/neofilm-creatives;
      mc mb --ignore-existing local/neofilm-uploads;
      mc anonymous set download local/neofilm-creatives;
      mc anonymous set download local/neofilm-uploads;
      exit 0;
      "

  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    volumes:
      - /volume2/docker/neofilm-staging/mosquitto:/mosquitto/config
    ports:
      - '1893:1883' # prod = 1883

  api:
    image: kyksdev/neofilm-api:staging
    restart: always
    ports:
      - '3011:3001' # prod = 3001
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:NeoStaging2026%21@postgres:5432/neofilm
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: NeoStagingRedis2026!
      JWT_SECRET: 74ea1c707cc4c4eb814144745195a620378903307ab33693
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      API_PORT: 3001
      API_CORS_ORIGINS: https://neofilmtestapi.alkaya.fr
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: NeoStagingMinio2026!
      S3_REGION: us-east-1
      S3_BUCKET_CREATIVES: neofilm-creatives
      S3_BUCKET_UPLOADS: neofilm-uploads
      CDN_BASE_URL: https://neofilmtestapi.alkaya.fr/neofilm-creatives
      API_PUBLIC_URL: https://neofilmtestapi.alkaya.fr/api/v1
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      # Stripe de TEST — pas necessaire pour tester l'anti-VM. A remplir si besoin.
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
    depends_on:
      - postgres
      - redis
      - minio
      - mosquitto

  coworking:
    image: kyksdev/neofilm-coworking:staging
    restart: always
    ports:
      - '3016:3006' # prod = 3006
    environment:
      NODE_ENV: production
      PORT: 3006
      HOSTNAME: 0.0.0.0
    depends_on:
      - api

  tv-legacy:
    image: kyksdev/neofilm-tv-legacy:staging
    restart: always
    ports:
      - '3015:3005' # prod = 3005
    environment:
      NODE_ENV: production
      PORT: 3005
      HOSTNAME: 0.0.0.0
    depends_on:
      - api

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - '8092:8080' # prod = 8082
    depends_on:
      - postgres
